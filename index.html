<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New canvas</title>
    <link rel="stylesheet" href="canvas.css" />
  </head>
  <body>
    <main class="canvas">
      <header class="header">
        <h1>Title</h1>
      </header>

      <div class="subtitle">Author, institution</div>

      <section class="content" data-measure="Content">
        <section class="card">
          <h2>Heading</h2>
          <p>Body text. All sizes are based on <b>--u</b> in <code>canvas.css</code>.</p>
        </section>
        <section class="card">
          <h2>Heading</h2>
          <ul>
            <li>First point</li>
            <li>Second point</li>
          </ul>
        </section>
        <section class="card">
          <h2>Heading</h2>
          <p>Images live in <code>img/</code> and are referenced relatively: <code>src="img/name.jpg"</code>.</p>
        </section>
      </section>

      <footer class="footer"></footer>
    </main>
  </body>
</html>
